version: 2

models:
  - name: stg_customers
    description: "Clientes limpios desde RDS MySQL."
    columns:
      - name: customer_id
        description: "PK del cliente."
        tests: [unique, not_null]
      - name: customer_name
        tests: [not_null]
      - name: gender
        tests:
          - accepted_values:
              arguments:
                values: ['Male', 'Female']
                quote: true

  - name: stg_products
    description: "Productos limpios desde Airtable."
    columns:
      - name: product_id
        tests: [unique, not_null]

  - name: stg_stores
    description: "Tiendas limpias desde Google Sheets."
    columns:
      - name: store_id
        tests: [unique, not_null]

  - name: stg_dates
    description: "Dimension de fechas limpia."
    columns:
      - name: date_id
        tests: [unique, not_null]

  - name: stg_sales
    description: "Hechos de ventas limpios. Sin PK natural - grano = (date_id, product_id, customer_id, store_id)."
    columns:
      - name: date_id
        tests: [not_null]
      - name: product_id
        tests: [not_null]
      - name: customer_id
        tests: [not_null]
      - name: store_id
        tests: [not_null]
