version: 2

models:
  - name: dim_customer
    description: "Dimension de clientes (final)."
    columns:
      - name: customer_id
        tests: [unique, not_null]

  - name: dim_product
    description: "Dimension de productos (final)."
    columns:
      - name: product_id
        tests: [unique, not_null]

  - name: dim_store
    description: "Dimension de tiendas (final)."
    columns:
      - name: store_id
        tests: [unique, not_null]

  - name: dim_date
    description: "Dimension de fechas (final)."
    columns:
      - name: date_id
        tests: [unique, not_null]

  - name: fact_sales
    description: "Tabla de hechos de ventas (grano = una venta)."
    columns:
      - name: sale_id
        tests: [unique, not_null]
      - name: customer_id
        tests:
          - relationships:
              to: ref('dim_customer')
              field: customer_id
      - name: product_id
        tests:
          - relationships:
              to: ref('dim_product')
              field: product_id
      - name: store_id
        tests:
          - relationships:
              to: ref('dim_store')
              field: store_id
      - name: date_id
        tests:
          - relationships:
              to: ref('dim_date')
              field: date_id
